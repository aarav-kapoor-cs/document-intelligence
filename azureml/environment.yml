# Conda environment for the training job only. The FastAPI backend installs none
# of this: it applies the exported coefficients with numpy, which
# backend-python/requirements.txt has always pinned.
name: gst-anomaly-train

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      # Pinned to exactly what backend-python/requirements.txt has. The model is
      # fitted here and applied there, so any difference in float behaviour
      # between the two would show up as a document scoring differently in
      # training than in production.
      - numpy==2.5.1
      - pandas==2.3.3

      # Training only. scikit-learn 1.6+ is required for the numpy 2.x ABI.
      - scikit-learn==1.6.1
      - mlflow==2.19.0
      - azureml-mlflow==1.59.0

      # Not used by the training maths at all - they are here because importing
      # anomaly_features pulls the whole backend in behind it:
      #
      #   anomaly_features -> excel_service   -> openpyxl, ocr_service
      #                                          -> azure-ai-documentintelligence
      #                    -> keyword_search  -> pandas, azure-search-documents
      #                                       -> ai_service -> openai
      #
      # Leaving them out fails the job at the first import, several minutes into
      # a run, with a ModuleNotFoundError that says nothing about training. They
      # are pinned to the same versions as backend-python/requirements.txt.
      #
      # Worth fixing properly one day: anomaly_features imports keyword_search
      # for CORE_FIELDS alone - twelve strings - and that single line is what
      # drags the search and OCR stacks into a job that needs neither.
      - openpyxl==3.1.5
      - azure-ai-documentintelligence==1.0.2
      - azure-search-documents==12.0.0
      - openai==2.46.0
      - python-dotenv==1.2.2
